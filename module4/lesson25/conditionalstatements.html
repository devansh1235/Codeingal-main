In this activity, learn about the purpose of conditional statements using Date() method. -->
<!DOCTYPE HTML>
<html>

<head>

</head>

<body>
    <button onclick="myfunction()">try me</button>
    <p id="hour">

    </p>
    <p id= "greet"> 

    </p>
    <script>
function myfunction(){
    var greeting;
    var time = new Date().getHours()
    if (time<12){
greeting="good morning"
    }
    else if (time<16){
        greeting = "good afternoon"
    }
     else if (time < 18) {
        greeting = "good evening"
    }
     else  {
        greeting = "good night"
    }
document.getElementById("hour").innerHTML="current hour is"+time 
    document.getElementById("greet").innerHTML = "Hello," + greeting
}

      
    </script>
</body>

</html>
