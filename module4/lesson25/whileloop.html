<!-- Generate random numbers using a while loop
Outline:
In this activity, learn how to generate random numbers using a while loop. -->
<!DOCTYPE HTML>
<html>

<head>

</head>

<body>
    <p id="demo">

    </p>
    <script>
      var a="";
      var i= 0;
      while(i<10){
        a+="<br>The number is "+i
i++
      }
      document.getElementById("demo").innerHTML=a;
    </script>
</body>

</html>
